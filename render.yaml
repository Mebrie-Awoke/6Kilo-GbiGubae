services:
  - type: web
    name: 6kilo-gbigubae-bot
    env: python
    plan: starter
    numInstances: 1
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: SUPER_ADMIN_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: gbigubae_bot
      - key: WEBHOOK_SECRET
        sync: false
      - key: TIMEZONE
        value: Africa/Addis_Ababa
      - key: BATCHES
        value: 1st Year,2nd Year,3rd Year,4th Year,5th Year,6th Year
